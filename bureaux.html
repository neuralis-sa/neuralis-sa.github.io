<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquette 3D – bureaux Neuralis, Faact, BBX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#dfe7ec;font-family:Barlow,system-ui,sans-serif;color:#1f2a30}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{position:fixed;left:10px;top:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:2}
.seg{pointer-events:auto;display:flex;background:#fff;border-radius:10px;padding:3px;box-shadow:0 1px 3px rgba(20,40,50,.18)}
.seg button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;padding:7px 11px;border-radius:7px;color:#1f2a30;cursor:pointer}
.seg button[aria-pressed=true]{background:#1f2a30;color:#fff}
.seg button:focus-visible{outline:2px solid #2a7fb8;outline-offset:1px}
.lbl{position:fixed;left:0;top:0;font-size:12px;font-weight:600;line-height:1.15;background:rgba(255,255,255,.88);padding:3px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;text-align:center;z-index:1}
.lbl small{display:block;font-weight:400;font-size:10.5px;color:#4a5a62}
.lbl.site{background:none;font-weight:500;font-style:italic;color:#46555c;font-size:12px;text-shadow:0 0 3px rgba(255,255,255,.8)}
.hide-lbl .lbl:not(.site){display:none}
.compass{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,40,50,.18);display:grid;place-items:center;z-index:2}
.compass div{width:0;height:0;position:relative}
.compass span{position:absolute;left:-6px;top:-19px;font-size:11px;font-weight:600}
.compass i{position:absolute;left:-5px;top:-6px;border:5px solid transparent;border-bottom:12px solid #b8342c;border-top:0}
.hint{position:fixed;left:10px;bottom:12px;font-size:12px;color:#4a5a62;background:rgba(255,255,255,.75);padding:4px 8px;border-radius:6px;z-index:2}
</style>
</head>
<body>
<canvas id="c" aria-label="Maquette 3D du bâtiment"></canvas>
<div class="bar">
  <div class="seg" role="group" aria-label="Niveau affiché">
    <button data-l="stack" aria-pressed="true">Assemblé</button>
    <button data-l="both" aria-pressed="false">Éclaté</button>
    <button data-l="rez" aria-pressed="false">Rez</button>
    <button data-l="1er" aria-pressed="false">1er</button>
  </div>
  <div class="seg" role="group" aria-label="Vue">
    <button id="v3d">3D</button><button id="vtop">Dessus</button><button id="vreset">Recentrer</button>
  </div>
  <div class="seg"><button id="roof" aria-pressed="true">Toit</button><button id="cut" aria-pressed="true">Murs coupés</button></div>
  <div class="seg"><button id="tl" aria-pressed="true">Noms</button></div>
</div>
<div class="compass" aria-hidden="true"><div id="nd"><span>N</span><i></i></div></div>
<div class="hint">1 doigt : tourner. 2 doigts : zoomer et déplacer. Souris : clic droit pour déplacer</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const W=12.66, D=17.44, H=2.85, LV=3.1, EXP=4.2, CUT=1.35;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.localClippingEnabled=true;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,0.1,900);

/* ---------- aléatoire déterministe ---------- */
let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const lin=c=>new THREE.Color(c).convertSRGBToLinear();
const std=(c,o={})=>{const m=new THREE.MeshStandardMaterial(Object.assign({roughness:.85,metalness:0},o));m.color=lin(c);return m;};

/* ---------- textures procédurales ---------- */
const ANI=renderer.capabilities.getMaxAnisotropy();
function tex(size,draw,tile){
  const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=ANI;
  if(tile)t.repeat.set(1/tile,1/tile);return t;
}
const noise=(x,s,n,a,cols)=>{for(let i=0;i<n;i++){x.fillStyle=cols[Math.floor(rnd()*cols.length)];x.globalAlpha=a*rnd();const r=rnd()*2+.5;x.fillRect(rnd()*s,rnd()*s,r,r);}x.globalAlpha=1;};
const T={
 parquet:tex(512,(x,s)=>{const ph=46,pl=256;for(let r=0;r*ph<s;r++){const off=(r*97)%pl;for(let px=-off;px<s;px+=pl){const l=70+rnd()*9;x.fillStyle=`hsl(${30+rnd()*6},${34+rnd()*10}%,${l}%)`;x.fillRect(px,r*ph,pl,ph);
   x.strokeStyle='rgba(90,60,30,.10)';for(let k=0;k<5;k++){x.beginPath();const yy=r*ph+rnd()*ph;x.moveTo(px,yy);x.bezierCurveTo(px+80,yy+rnd()*6-3,px+170,yy+rnd()*6-3,px+pl,yy);x.stroke();}
   x.strokeStyle='rgba(70,45,25,.35)';x.strokeRect(px+.5,r*ph+.5,pl,ph);}}},2),
 conc:tex(512,(x,s)=>{x.fillStyle='#cfcfcb';x.fillRect(0,0,s,s);noise(x,s,9000,.12,['#9d9d98','#e8e8e4','#b7b6b0']);
   for(let i=0;i<40;i++){x.fillStyle=`rgba(${120+rnd()*60|0},${120+rnd()*60|0},${115+rnd()*60|0},.05)`;x.beginPath();x.arc(rnd()*s,rnd()*s,20+rnd()*70,0,7);x.fill();}},4),
 tiles:tex(512,(x,s)=>{x.fillStyle='#e6e8e8';x.fillRect(0,0,s,s);noise(x,s,3000,.06,['#cfd2d2','#fafafa']);x.fillStyle='#b4b9ba';for(let i=0;i<=4;i++){x.fillRect(i*s/4-1,0,2,s);x.fillRect(0,i*s/4-1,s,2);}},2.4),
 carpet:tex(256,(x,s)=>{x.fillStyle='#bfbfbf';x.fillRect(0,0,s,s);noise(x,s,14000,.25,['#8c8c8c','#e0e0e0','#a6a6a6']);x.strokeStyle='rgba(0,0,0,.06)';for(let i=0;i<=2;i++){x.strokeRect(0,0,s/2*i,s/2*i);}},1),
 deck:tex(512,(x,s)=>{const bh=36;for(let r=0;r*bh<s;r++){x.fillStyle=`hsl(${26+rnd()*6},${34+rnd()*8}%,${42+rnd()*10}%)`;x.fillRect(0,r*bh,s,bh-4);x.fillStyle='#3b2b1f';x.fillRect(0,r*bh+bh-4,s,4);
   x.strokeStyle='rgba(40,25,10,.18)';for(let k=0;k<4;k++){x.beginPath();const yy=r*bh+rnd()*(bh-6);x.moveTo(0,yy);x.lineTo(s,yy+rnd()*4-2);x.stroke();}}},2),
 grass:tex(512,(x,s)=>{x.fillStyle='#8fae6b';x.fillRect(0,0,s,s);noise(x,s,26000,.35,['#6e8f4e','#a9c585','#7d9c5b','#b8cf8f']);}),
 asph:tex(512,(x,s)=>{x.fillStyle='#6d7274';x.fillRect(0,0,s,s);noise(x,s,26000,.35,['#50575a','#8a8f90','#5f6568']);}),
 ribV:tex(256,(x,s)=>{x.fillStyle='#d6d8d5';x.fillRect(0,0,s,s);for(let i=0;i<8;i++){x.fillStyle='#bfc2bf';x.fillRect(i*s/8,0,6,s);x.fillStyle='#e6e8e5';x.fillRect(i*s/8+6,0,3,s);}}),
 ribH:tex(256,(x,s)=>{x.fillStyle='#b9bec1';x.fillRect(0,0,s,s);for(let i=0;i<6;i++){x.fillStyle='#98a0a4';x.fillRect(0,i*s/6,s,5);x.fillStyle='#d3d7d9';x.fillRect(0,i*s/6+5,s,2);}})
};
const rep=(t,u,v)=>{const c=t.clone();c.needsUpdate=true;c.repeat.set(u,v);return c;};

/* ---------- ciel ---------- */
scene.background=tex(256,(x,s)=>{const g=x.createLinearGradient(0,0,0,s);g.addColorStop(0,'#8fb6d6');g.addColorStop(.6,'#cfe0ea');g.addColorStop(1,'#eef2f3');x.fillStyle=g;x.fillRect(0,0,s,s);});
scene.background.wrapS=scene.background.wrapT=THREE.ClampToEdgeWrapping;
scene.fog=new THREE.Fog(lin(0xe3ebef),220,600);
scene.add(new THREE.HemisphereLight(lin(0xdfeaf5),lin(0x8d8f86),0.7));
const sun=new THREE.DirectionalLight(lin(0xfff0da),1.25);
sun.position.set(16,32,26); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:100});
scene.add(sun);

/* ---------- matériaux ---------- */
const M={
 top:std(0xf6f6f4,{roughness:.5}), oak:std(0xc9a57a,{roughness:.55}), legs:std(0x3a3f42,{roughness:.4,metalness:.6}),
 fabric:std(0x33393d), screenP:std(0x7e9189), mon:std(0x1c1f22,{roughness:.35,metalness:.2}),
 disp:new THREE.MeshStandardMaterial({color:lin(0x243a52),emissive:lin(0x3d6a94),emissiveIntensity:.55,roughness:.2}),
 kb:std(0x2a2d30), white:std(0xfbfbfb,{roughness:.3}), steel:std(0xc7cbcd,{roughness:.25,metalness:.8}),
 pot:std(0x3b4043,{roughness:.6}), terra:std(0xb86b45), sofa:std(0x55706c), sofa2:std(0x8a8f86), rug:std(0x9aa7a2),
 wood:std(0xb58656), card:std(0xc9a574), card2:std(0xb8925f), rackU:std(0x2f5d9e,{roughness:.5,metalness:.3}), rackB:std(0xe07b1f,{roughness:.5,metalness:.3}),
 yellow:std(0xe3b21a,{roughness:.45}), dark:std(0x24282b), step:std(0xcac6bd), rail:std(0x9cc9e8,{transparent:true,opacity:.28,roughness:.05}),
 cush:std(0xe7dfcf), alu:std(0x4a4f53,{roughness:.4,metalness:.5}), canopy:std(0xece5d6,{side:THREE.DoubleSide}),
 printer:std(0xe4e6e7,{roughness:.4}), printerD:std(0x505558), locker:std(0x9fb0b8,{roughness:.5,metalness:.2}), trunk:std(0x6b4f36), line:std(0xf0c419)
};
const LEAF=[0x3f7a3a,0x4f8c43,0x5c9a4a,0x2f6b34,0x6aa653].map(c=>std(c,{flatShading:true,roughness:.8}));
const FL={
 parquet:std(0xffffff,{map:T.parquet,roughness:.55}),
 concL:std(0xf2f1ec,{map:T.conc,roughness:.45}), concC:std(0xe2e0da,{map:T.conc,roughness:.5}), concT:std(0xd8d6cf,{map:T.conc,roughness:.6}),
 tiles:std(0xffffff,{map:T.tiles,roughness:.25}),
 carpN:std(0xa9b8c8,{map:T.carpet}), carpF:std(0xc8b3be,{map:T.carpet}), carpD:std(0xb1accc,{map:T.carpet}),
 epoxF:std(0xe6cfdc,{map:T.conc,roughness:.3}), epoxN:std(0xcfdcea,{map:T.conc,roughness:.3}),
 deck:std(0xffffff,{map:T.deck,roughness:.8})
};
function levelMats(){
  const plane=new THREE.Plane(new THREE.Vector3(0,-1,0),CUT);
  return {plane,
    wall:std(0xf4f3ef,{clippingPlanes:[plane],side:THREE.DoubleSide,roughness:.9}),
    clad:std(0x474d52,{clippingPlanes:[plane],roughness:.6,metalness:.3}),
    glass:std(0xa9d0ea,{transparent:true,opacity:.28,roughness:.05,metalness:.1,clippingPlanes:[plane]}),
    frame:std(0x2f3336,{clippingPlanes:[plane],roughness:.4,metalness:.5}),
    frost:std(0xeef3f5,{transparent:true,opacity:.86,roughness:1,clippingPlanes:[plane]}),
    sect:std(0xffffff,{map:rep(T.ribH,1,3),clippingPlanes:[plane],roughness:.5,metalness:.4})};
}
const LM={rez:levelMats(),e1:levelMats()};

const gRez=new THREE.Group(), g1=new THREE.Group(), gSite=new THREE.Group();
scene.add(gRez,g1,gSite);

/* ---------- primitives ---------- */
const X=x=>x-W/2, Z=y=>y-D/2;
function box(g,x0,y0,x1,y1,h0,h1,mat,shadow=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1-x0),h1-h0,Math.abs(y1-y0)),mat);
  m.position.set(X((x0+x1)/2),(h0+h1)/2,Z((y0+y1)/2));
  if(shadow){m.castShadow=true;m.receiveShadow=true;} g.add(m); return m;
}
function cyl(g,x,y,r0,r1,h0,h1,mat,seg=16){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r0,r1,h1-h0,seg),mat);m.position.set(X(x),(h0+h1)/2,Z(y));m.castShadow=true;m.receiveShadow=true;g.add(m);return m;
}
function floor(g,pts,mat,y=0.02){
  const s=new THREE.Shape();pts.forEach((p,i)=>i?s.lineTo(X(p[0]),Z(p[1])):s.moveTo(X(p[0]),Z(p[1])));
  const m=new THREE.Mesh(new THREE.ShapeGeometry(s),mat);m.material.side=THREE.DoubleSide;
  m.rotation.x=Math.PI/2;m.position.y=y;m.receiveShadow=true;g.add(m);
}
const R=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
function walls(g,list,mat){
  list.forEach(([x1,y1,x2,y2])=>{
    if(y1===y2) box(g,Math.min(x1,x2),y1-.05,Math.max(x1,x2),y1+.05,0,H,mat);
    else box(g,x1-.05,Math.min(y1,y2),x1+.05,Math.max(y1,y2),0,H,mat);});
}
function facade(g,side,ops,L){
  const len=(side==='N'||side==='S')?W:D;
  const OUT={N:5,S:4,W:1,E:0}[side];
  const piece=(a,b,h0,h1,mat,kind='full')=>{
    if(b<=a+1e-3) return;
    const [t0,t1]={full:[-.3,0],glass:[-.17,-.13],frame:[-.21,-.09]}[kind];
    let mm=mat; if(mat===L.wall){mm=[L.wall,L.wall,L.wall,L.wall,L.wall,L.wall];mm[OUT]=L.clad;}
    if(side==='N') box(g,a,t0,b,t1,h0,h1,mm);
    if(side==='S') box(g,a,D-t1,b,D-t0,h0,h1,mm);
    if(side==='W') box(g,t0,a,t1,b,h0,h1,mm);
    if(side==='E') box(g,W-t1,a,W-t0,b,h0,h1,mm);
  };
  const frames=(a,b,h0,h1)=>{
    piece(a,b,h0,h0+.06,L.frame,'frame');piece(a,b,h1-.06,h1,L.frame,'frame');
    piece(a,a+.06,h0,h1,L.frame,'frame');piece(b-.06,b,h0,h1,L.frame,'frame');
    const n=Math.max(1,Math.round((b-a)/1.35));
    for(let k=1;k<n;k++){const m=a+k*(b-a)/n;piece(m-.03,m+.03,h0,h1,L.frame,'frame');}
  };
  let cur=-.3;
  ops.forEach(([a,b,t])=>{
    piece(cur,a,0,H,L.wall);
    if(t==='w'){piece(a,b,0,.7,L.wall);piece(a,b,.7,2.4,L.glass,'glass');frames(a,b,.7,2.4);piece(a,b,2.4,H,L.wall);}
    if(t==='wf'){piece(a,b,0,.7,L.wall);piece(a,b,.7,1.9,L.frost,'glass');piece(a,b,1.9,2.4,L.glass,'glass');frames(a,b,.7,2.4);piece(a,b,2.4,H,L.wall);}
    if(t==='wF'){piece(a,b,0,.7,L.wall);piece(a,b,.7,2.4,L.frost,'glass');frames(a,b,.7,2.4);piece(a,b,2.4,H,L.wall);}
    if(t==='d'){piece(a,b,0,2.2,L.glass,'glass');frames(a,b,0,2.2);piece(a,b,2.2,H,L.wall);}
    if(t==='s'){piece(a,b,0,2.6,L.sect,'glass');piece(a,b,2.6,H,L.wall);}
    if(t==='r'){piece(a,b,0,1.0,M.rail,'glass');piece(a,b,1.0,1.05,M.alu,'frame');}
    cur=b;
  });
  piece(cur,len+.3,0,H,L.wall);
}

/* ---------- mobilier ---------- */
function part(grp,w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;grp.add(m);return m;}
function place(g,grp,x,y,ang){grp.position.set(X(x),0,Z(y));grp.rotation.y=ang;g.add(grp);}
const faceAng=(x,y,tx,ty)=>Math.atan2(tx-x,ty-y);
function chair(g,x,y,ang,type='office'){
  const c=new THREE.Group();
  if(type==='office'){
    part(c,.48,.07,.46,0,.47,0,M.fabric); part(c,.46,.5,.05,0,.8,-.22,M.fabric);
    const st=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.4,8),M.legs);st.position.y=.25;c.add(st);
    const b=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.03,5),M.legs);b.position.y=.05;c.add(b);
  }else{
    const mat=type==='wood'?M.oak:M.alu;
    part(c,.44,.04,.44,0,.45,0,mat); part(c,.44,.36,.03,0,.72,-.2,mat);
    [[-.19,-.19],[.19,-.19],[-.19,.19],[.19,.19]].forEach(([a,b])=>part(c,.03,.45,.03,a,.225,b,mat));
    if(type==='out') part(c,.4,.05,.4,0,.495,0,M.cush);
  }
  place(g,c,x,y,ang);
}
function monitor(g,x,y,ang,base=.745){
  const m=new THREE.Group();
  part(m,.22,.015,.16,0,base+.008,0,M.mon); part(m,.05,.3,.04,0,base+.16,-.03,M.mon);
  part(m,.62,.37,.025,0,base+.36,0,M.mon);
  const s=new THREE.Mesh(new THREE.PlaneGeometry(.59,.34),M.disp);s.position.set(0,base+.36,.0135);m.add(s);
  place(g,m,x,y,ang);
}
function deskT(g,x,y,w,h){
  box(g,x+.01,y+.01,x+w-.01,y+h-.01,.72,.745,M.top);
  if(w>=h){box(g,x+.05,y+.06,x+.09,y+h-.06,0,.72,M.legs);box(g,x+w-.09,y+.06,x+w-.05,y+h-.06,0,.72,M.legs);}
  else{box(g,x+.06,y+.05,x+w-.06,y+.09,0,.72,M.legs);box(g,x+.06,y+h-.09,x+w-.06,y+h-.05,0,.72,M.legs);}
}
function ws(g,x,y,w,h,side){
  deskT(g,x,y,w,h); const cx=x+w/2, cy=y+h/2;
  const S={N:[cx,y-.32,cx,y+h-.2,Math.PI,cx,y+.18,0],S:[cx,y+h+.32,cx,y+.2,0,cx,y+h-.18,0],
           W:[x-.32,cy,x+w-.2,cy,-Math.PI/2,x+.2,cy,1],E:[x+w+.32,cy,x+.2,cy,Math.PI/2,x+w-.2,cy,1]}[side];
  chair(g,S[0],S[1],faceAng(S[0],S[1],cx,cy));
  monitor(g,S[2],S[3],S[4]);
  if(S[7]) box(g,S[5]-.07,S[6]-.21,S[5]+.07,S[6]+.21,.745,.76,M.kb,false); else box(g,S[5]-.21,S[6]-.07,S[5]+.21,S[6]+.07,.745,.76,M.kb,false);
}
function bench4(g,x,y){
  ws(g,x,y,1.6,.8,'N');ws(g,x+1.6,y,1.6,.8,'N');ws(g,x,y+.8,1.6,.8,'S');ws(g,x+1.6,y+.8,1.6,.8,'S');
  box(g,x+.05,y+.785,x+3.15,y+.815,.745,1.12,M.screenP);
}
function mtable(g,x0,y0,x1,y1,chairs,type='office',mat=M.top){
  box(g,x0,y0,x1,y1,.72,.75,mat);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  box(g,cx-.05,cy-.05,cx+.05,cy+.05,0,.72,M.legs);
  if(x1-x0>y1-y0) box(g,x0+.25,cy-.3,x1-.25,cy+.3,.02,.05,M.legs); else box(g,cx-.3,y0+.25,cx+.3,y1-.25,.02,.05,M.legs);
  chairs.forEach(([x,y])=>chair(g,x,y,faceAng(x,y,cx,cy),type));
}
function plant(g,x,y,size='L'){
  const L=size==='L';
  cyl(g,x,y,L?.24:.15,L?.19:.12,0,L?.45:.3,M.pot);
  const n=L?6:3;
  for(let i=0;i<n;i++){
    const r=(L?.26:.17)+rnd()*(L?.14:.08);
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),LEAF[Math.floor(rnd()*LEAF.length)]);
    m.position.set(X(x)+(rnd()-.5)*(L?.35:.18),(L?.72:.45)+rnd()*(L?.7:.3),Z(y)+(rnd()-.5)*(L?.35:.18));
    m.castShadow=true;g.add(m);

/* ================= Caméra / contrôles ================= */
const RMIN=2.5,RMAX=180,PMIN=0.02,PMAX=1.48;
const cam={theta:Math.PI*0.78,phi:0.95,rad:40,tx:0,tz:0};       // valeurs visées
const cur={theta:cam.theta,phi:cam.phi,rad:cam.rad,tx:0,tz:0};  // valeurs affichées
const target=new THREE.Vector3(0,3,0);
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const nd=document.getElementById('nd');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function placeCam(){
  const k=reduce?1:.2;
  for(const key in cam) cur[key]+=(cam[key]-cur[key])*k;
  target.x=cur.tx; target.z=cur.tz;
  camera.position.set(target.x+cur.rad*Math.sin(cur.phi)*Math.sin(cur.theta),target.y+cur.rad*Math.cos(cur.phi),target.z+cur.rad*Math.sin(cur.phi)*Math.cos(cur.theta));
  camera.lookAt(target); nd.style.transform='rotate('+cur.theta+'rad)';
}
function pan(dx,dy){
  const k=cam.rad*.0016, th=cam.theta;
  const rx=Math.cos(th), rz=-Math.sin(th), fx=-Math.sin(th), fz=-Math.cos(th);
  cam.tx=clamp(cam.tx-rx*dx*k+fx*dy*k,-70,70);
  cam.tz=clamp(cam.tz-rz*dx*k+fz*dy*k,-70,70);
}
const zoom=f=>{cam.rad=clamp(cam.rad*f,RMIN,RMAX);};
const ptrs=new Map(); let pinch0=0, rad0=cam.rad, mid0=null, btn=0;
const midOf=()=>{const [a,b]=[...ptrs.values()];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};};
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});btn=(e.button===2||e.shiftKey)?2:0;
  if(ptrs.size===2){const m=midOf();pinch0=m.d;rad0=cam.rad;mid0=m;}});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    if(btn===2) pan(dx,dy);
    else {cam.theta-=dx*.006; cam.phi=clamp(cam.phi-dy*.005,PMIN,PMAX);}
  } else if(ptrs.size===2&&pinch0){
    const m=midOf(); cam.rad=clamp(rad0*pinch0/m.d,RMIN,RMAX);
    pan(m.x-mid0.x,m.y-mid0.y); mid0=m;
  }
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2){pinch0=0;mid0=null;}};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(1+clamp(e.deltaY,-100,100)*.0015);},{passive:false});
canvas.addEventListener('dblclick',()=>zoom(.6));
document.getElementById('v3d').addEventListener('click',()=>{cam.phi=.95;cam.rad=clamp(cam.rad,20,60);});
document.getElementById('vtop').addEventListener('click',()=>{cam.phi=PMIN;cam.theta=Math.round(cam.theta/(2*Math.PI))*2*Math.PI;cam.rad=Math.max(cam.rad,32);});
document.getElementById('vreset').addEventListener('click',()=>{Object.assign(cam,{theta:Math.PI*0.78,phi:.95,rad:40,tx:0,tz:0});});

let mode='stack',cutOn=true,roofOn=true,y1Target=LV,tY=3;
function setMode(m){
  mode=m;document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===m));
  gRez.visible=(m!=='1er');g1.visible=(m!=='rez');
  y1Target=(m==='1er')?0:(m==='stack'?LV:LV+EXP); tY=(m==='both')?3.5:(m==='stack'?3:1);
  gRoof.visible=(m==='stack'&&roofOn);
  if(reduce){g1.position.y=y1Target;target.y=tY;}
}
document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.l)));
document.getElementById('cut').addEventListener('click',e=>{cutOn=!cutOn;e.currentTarget.setAttribute('aria-pressed',cutOn);});
document.getElementById('roof').addEventListener('click',e=>{roofOn=!roofOn;e.currentTarget.setAttribute('aria-pressed',roofOn);setMode(mode);});
document.getElementById('tl').addEventListener('click',e=>{const off=document.body.classList.toggle('hide-lbl');e.currentTarget.setAttribute('aria-pressed',!off);});
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();setMode('stack');g1.position.y=y1Target;target.y=tY;

const v=new THREE.Vector3();
function frame(){
  if(!reduce){g1.position.y+=(y1Target-g1.position.y)*.12;target.y+=(tY-target.y)*.12;}
  const c=(cutOn&&!gRoof.visible)?CUT:50; LM.rez.plane.constant=c; LM.e1.plane.constant=g1.position.y+c;
  placeCam(); renderer.render(scene,camera);
  const w=window.innerWidth,h=window.innerHeight;
  labels.forEach(L=>{
    if(!L.group.visible||(L.group===gRez&&mode==='stack')||(L.group===g1&&gRoof.visible)){L.el.style.display='none';return;}
    v.copy(L.p);L.group.localToWorld(v);v.project(camera);
    if(v.z>1||v.z<-1){L.el.style.display='none';return;}
    L.el.style.display='';L.el.style.transform='translate('+((v.x+1)/2*w)+'px,'+((1-v.y)/2*h)+'px) translate(-50%,-50%)';
  });
  requestAnimationFrame(frame);
}
frame();
})();
